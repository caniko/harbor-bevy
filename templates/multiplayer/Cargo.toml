[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[package]
name = "harbor-multiplayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_replicated = { package = "veritasium_replicated", git = "https://github.com/caniko/harbor-bevy.git", branch = "trunk" }
blake3 = "1"
harbor-bevy = { git = "https://github.com/caniko/harbor-bevy.git", branch = "trunk", features = ["core", "ui", "veritasium-observers"] }
harbor-bevy-net = { git = "https://github.com/caniko/harbor-bevy.git", branch = "trunk" }
rkyv = "0.8.17"

# This in-process example needs no libp2p overrides. Before enabling live
# transport, review Harbor's swarm and relay fixes in vendor/README.md.
[patch.crates-io]

[package]
name = "veritasium_replicated"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Unopinionated Bevy replication substrate: derive-marked components/resources, ordered transactions, chain hashes, and adapter-facing interop packets."
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/harbor-bevy"
readme = "README.md"
publish = false
keywords = ["bevy", "replication", "networking", "deterministic", "ecs"]
categories = ["game-development", "network-programming"]
include = [
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "docs/**",
  "examples/**",
  "compile_fail/**",
  "compile_pass/**",
  "src/**",
  "tests/**",
]

# The package identity is `veritasium_replicated`; the lib target keeps the
# Bevy-ecosystem-facing alias `bevy_replicated` so consumer imports and the
# derive macros' emitted `::bevy_replicated::` paths stay stable. Workspace
# consumers depend on it through the renamed workspace entry
# `bevy_replicated = { package = "veritasium_replicated", ... }`.
[lib]
name = "bevy_replicated"

[features]
default = []

[dependencies]
# The mediated write gate (`MediatedAccess`, `MediatedMutable`, `MediatedMut`)
# comes from the veritasium Bevy fork patched by this workspace (`rs-veritasium`).
# Released stock Bevy lacks it.
bevy = { workspace = true, features = ["std", "bevy_state"] }
bevy_replicated_macros = { package = "veritasium_replicated_macros", path = "../replicated-macros", version = "0.1.0" }
blake3 = { version = "1", default-features = true }
log = { version = "0.4", features = [
  "max_level_debug",
  "release_max_level_warn",
] }
rustc-hash = "2.1"
veritasium_wire = { path = "../../crates/net/veritasium_wire", version = "0.1.0" }
rkyv = { version = "0.8", default-features = true }
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.4"
trybuild = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

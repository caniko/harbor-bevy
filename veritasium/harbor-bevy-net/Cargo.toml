[package]
name = "harbor-bevy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Equal-peer session networking for Veritasium Bevy"

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log", "bevy_state"] }
bevy_replicated = { package = "veritasium_replicated", path = "../replicated", version = "0.1.0" }
veritasium_wire = { path = "../../crates/net/veritasium_wire", version = "0.1.0" }
thespan = { path = "../../crates/net/thespan", version = "0.1.0" }
thespan_bevy = { path = "../../crates/bevy/thespan_bevy", version = "0.1.0" }
harbor-bevy-core = { path = "../../crates/bevy/harbor-bevy-core", version = "0.1.0", features = ["veritasium-observers"] }
blake3.workspace = true
libp2p = { version = "0.56", default-features = false, features = ["ed25519"] }
piying = { version = "0.1.3", default-features = false, features = ["remote", "macros", "rkyv-codec"] }
rand = "0.10"
rkyv.workspace = true
rustc-hash = "2.1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[lints]
workspace = true

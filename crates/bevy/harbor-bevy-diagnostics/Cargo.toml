[package]
name = "harbor-bevy-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Structured diagnostics with optional stock Bevy integration"

[features]
default = []
bevy = ["dep:bevy", "dep:harbor-bevy-core"]
minidumper = ["bevy", "dep:minidumper-child"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log"], optional = true }
blake3.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
harbor-bevy-core = { path = "../harbor-bevy-core", optional = true }
minidumper-child = { version = "0.3", optional = true }
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

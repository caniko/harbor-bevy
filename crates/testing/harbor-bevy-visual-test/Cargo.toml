[package]
name = "harbor-bevy-visual-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Bevy screenshot capture, visual comparisons, and coverage reports"

[lints]
workspace = true

[features]
default = []
rubric = ["dep:visual-rubric"]
update-snapshots = []

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_image",
    "bevy_picking",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "default_font",
    "multi_threaded",
    "png",
] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
image-compare = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile = "3"
thiserror = { workspace = true }
toml = "1"
visual-rubric = { version = "0.4.4", features = ["codex-acp"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
wait-timeout = "0.2"

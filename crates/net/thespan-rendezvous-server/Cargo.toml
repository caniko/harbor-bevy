[package]
name = "thespan-rendezvous-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thespan rendezvous discovery and libp2p relay server"

[lints]
workspace = true

[[bin]]
name = "thespan-rendezvous"
path = "src/main.rs"

[dependencies]
thespan-rendezvous-proto = { path = "../thespan-rendezvous-proto", version = "0.1.0" }
rkyv.workspace = true
libp2p = { version = "0.56", default-features = false, features = [
    "tokio",
    "macros",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "identify",
    "ping",
    "relay",
    "request-response",
    "ed25519",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "io-util"] }
futures = "0.3"
async-trait = "0.1"
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
parking_lot = "0.12"

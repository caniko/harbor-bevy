[package]
name = "p2p-integrity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic cheat detection framework for P2P tournament play"

[features]
default = []

[dependencies]
# Cryptographic signatures
ed25519-dalek = { version = "2", default-features = false }
# Hashing
sha2 = "0.11"
blake3 = { workspace = true }
# Serialization
rkyv = { workspace = true }
# UUIDs (for conversion helpers)
uuid = { workspace = true }
# Random generation (for key generation)
getrandom = "0.4"
# Error handling
thiserror = { workspace = true }

[lints]
workspace = true

[package]
name = "attestation-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bevy-independent attestation broker"

[lints]
workspace = true

[dependencies]
platform-attestation = { path = "../platform-attestation", version = "0.1.0" }
trust-safety = { path = "../trust-safety", version = "0.1.0" }
diagnostics-policy = { path = "../diagnostics-policy", version = "0.1.0" }
serde_json = { workspace = true }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
# RS256 service-account JWTs and nonce entropy; already in Cargo.lock.
ring = "0.17"

[dependencies.clap]
workspace = true
features = ["env"]
optional = true

[dependencies.reqwest]
workspace = true
optional = true

[dependencies.http-client]
path = "../http-client"
version = "0.1.0"
optional = true

[dependencies.tokio]
workspace = true
features = ["macros", "rt-multi-thread", "net", "time"]
optional = true

[dependencies.hyper]
version = "1"
features = ["server", "http1"]
optional = true

[dependencies.hyper-util]
version = "0.1"
features = ["tokio"]
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.http]
version = "1"
optional = true

[dependencies.bytes]
version = "1"
optional = true

[features]
bin = [
    "dep:clap",
    "dep:reqwest",
    "dep:http-client",
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:http",
    "dep:bytes",
]

[[bin]]
name = "attestation-broker"
path = "src/main.rs"
required-features = ["bin"]
